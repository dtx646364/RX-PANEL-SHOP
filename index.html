<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1117;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Name Screen */
    #nameScreen {
      width: 90%;
      max-width: 400px;
      background: #181c25;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    #nameScreen h1 {
      margin-bottom: 10px;
    }

    #nameScreen p {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      border: none;
      outline: none;
      background: #252a35;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      border: none;
      cursor: pointer;
      background: #5865f2;
      color: white;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #4752c4;
    }

    /* Chat */
    #chatScreen {
      display: none;
      width: 95%;
      max-width: 700px;
      height: 90vh;
      background: #181c25;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    .header {
      height: 65px;
      background: #20242e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .header h2 {
      font-size: 20px;
    }

    .username {
      color: #9ca3af;
      font-size: 14px;
    }

    #messages {
      height: calc(100% - 135px);
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      max-width: 80%;
    }

    .message .user {
      font-size: 12px;
      color: #8b93a7;
      margin-bottom: 4px;
    }

    .message .text {
      display: inline-block;
      background: #252a35;
      padding: 10px 14px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .my-message {
      margin-left: auto;
      text-align: right;
    }

    .my-message .text {
      background: #5865f2;
      text-align: left;
    }

    .system {
      text-align: center;
      color: #777f91;
      font-size: 13px;
      margin: 15px 0;
    }

    .inputArea {
      height: 70px;
      background: #20242e;
      padding: 12px;
      display: flex;
      gap: 10px;
    }

    .inputArea input {
      margin: 0;
      flex: 1;
    }

    .inputArea button {
      width: 90px;
    }

    @media (max-width: 500px) {
      #chatScreen {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <!-- Name Screen -->
  <div id="nameScreen">
    <h1>💬 DTX Chat Room</h1>
    <p>Enter your name to join</p>
    <p>Devloper FELIX</p>

    <input
      type="text"
      id="nameInput"
      placeholder="Enter your name"
      maxlength="20"
    >

    <button onclick="joinChat()">Join Chat</button>
  </div>


  <!-- Chat Screen -->
  <div id="chatScreen">

    <div class="header">
      <div>
        <h2>💬 Chat Room</h2>
        <span class="username" id="displayName"></span>
      </div>
    </div>

    <div id="messages">
      <div class="system">
        Welcome to the chat 👋
      </div>
    </div>

    <div class="inputArea">
      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        maxlength="500"
        onkeydown="handleEnter(event)"
      >

      <button onclick="sendMessage()">SEND</button>
    </div>

  </div>


  <script>
    let username = "";

    function joinChat() {
      const name = document.getElementById("nameInput").value.trim();

      if (name === "") {
        alert("Please enter your name!");
        return;
      }

      username = name;

      document.getElementById("nameScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "block";

      document.getElementById("displayName").textContent =
        "You are chatting as " + username;

      document.getElementById("messageInput").focus();
    }


    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") return;

      addMessage(username, text, true);

      input.value = "";
      input.focus();
    }


    function addMessage(name, text, mine = false) {
      const messages = document.getElementById("messages");

      const message = document.createElement("div");
      message.className = "message";

      if (mine) {
        message.classList.add("my-message");
      }

      const user = document.createElement("div");
      user.className = "user";
      user.textContent = name;

      const messageText = document.createElement("div");
      messageText.className = "text";
      messageText.textContent = text;

      message.appendChild(user);
      message.appendChild(messageText);

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }


    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>

</body>
</html>
